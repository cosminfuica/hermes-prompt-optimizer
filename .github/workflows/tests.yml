name: tests

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  self-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Hermes release the plugin supports (v0.20.1) and a current one.
        hermes: [v2026.8.13, v2026.9.24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"  # the uv Hermes' own CI pins
      - name: Install Hermes ${{ matrix.hermes }}
        # Hermes' own install path: its source plus `uv sync --locked`, the hash-pinned dependency set.
        run: |
          git clone --quiet --depth 1 --branch ${{ matrix.hermes }} https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          cd "$RUNNER_TEMP/hermes" && uv sync --locked --quiet
          echo "$RUNNER_TEMP/hermes/.venv/bin" >> "$GITHUB_PATH"
      - name: Self-checks
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Desktop banner self-check
        # The React stack Hermes' desktop app ships (apps/desktop/package.json), plus jsdom.
        run: |
          npm install --prefix tests --no-save --no-package-lock --no-audit --no-fund \
            react@19.2.7 react-dom@19.2.7 @tanstack/react-query@5.101.2 jsdom@29.1.1
          node tests/test_desktop.mjs
      - name: hermes plugins doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins doctor . --ci
